apiVersion: v1
kind: ServiceAccount
metadata:
  name: indexer
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  namespace: rahbar
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: indexer
    spec:
      serviceAccountName: indexer
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: indexer
        image: rahbar-indexer:dev
        imagePullPolicy: IfNotPresent
        args: ["python", "-m", "pipeline.run", "--dummy"]
        envFrom:
        - configMapRef:
            name: rahbar-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
      volumes:
      - name: tmp
        emptyDir: {}
