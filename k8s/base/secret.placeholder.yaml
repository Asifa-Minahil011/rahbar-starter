# PLACEHOLDER ONLY. The real Secret is created from the command line, never from a file:
#   export LLM_API_KEY=...        (only needed for LLM_PROVIDER=hosted)
#   make secret
# This file is deliberately NOT listed in kustomization.yaml: applying it would
# overwrite the real Secret with REPLACE_ME.
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
