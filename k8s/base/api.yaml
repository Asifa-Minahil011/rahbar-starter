apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rahbar
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
      - name: api
        image: api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: rahbar-config
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        startupProbe:
          httpGet: 
            path: /healthz
            port: 8000
          failureThreshold: 30
          periodSeconds: 2
        livenessProbe:
          httpGet: 
            path: /healthz
            port: 8000
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet: 
            path: /readyz
            port: 8000
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rahbar
spec:
  selector:
    app: api
  ports:
  - port: 8000
