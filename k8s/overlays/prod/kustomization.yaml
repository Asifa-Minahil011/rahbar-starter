apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# CI/CD replaces these with your Docker Hub user and the commit SHA (never :latest).
images:
  - name: rahbar-api
    newName: docker.io/REPLACE_DOCKERHUB_USER/rahbar-api
    newTag: REPLACE_SHA
  - name: rahbar-ui
    newName: docker.io/REPLACE_DOCKERHUB_USER/rahbar-ui
    newTag: REPLACE_SHA
  - name: rahbar-indexer
    newName: docker.io/REPLACE_DOCKERHUB_USER/rahbar-indexer
    newTag: REPLACE_SHA
