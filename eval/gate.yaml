# Release gate (Assignment 3, C2). eval/gate.py compares a candidate suite result with the
# baseline suite result and exits 0 (pass) or 1 (fail).
#
# On Kubernetes this file is the ConfigMap `gate-config` (mounted at /config/gate.yaml):
# edit the ConfigMap, run the eval Job again, and the outcome changes without rebuilding
# any image (F2).
#
# check:   min                  metric must be >= value
#          max                  metric must be <= value
#          max_drop_vs_baseline metric may fall at most `value` below the baseline (absolute points)
#          max_rise_ratio       metric may be at most `value` times the baseline (latency)
#          not_below_baseline   metric must be >= the baseline
# optional: true  = a metric that was not measured is skipped instead of failing the gate
#
# The numbers are starting points. REPLACE each `why` with the measured baseline value and
# your reason before you hand in: the assignment asks you to justify faithfulness and p95.

rules:
  - id: recall5-drop
    metric: recall_at_5
    check: max_drop_vs_baseline
    value: 0.02
    why: "Assignment: recall@5 may not fall more than 2 points. One golden question is about 2 points at n=48."

  - id: faithfulness-floor
    metric: faithfulness
    check: min
    value: 0.60
    why: "WRITE: baseline faithfulness was X; floor = baseline minus 0.05 so noise on a CPU model does not block a release."

  - id: p95-latency
    metric: latency_p95_ms
    check: max
    value: 240000
    why: "WRITE: baseline p95 was X ms (llama3.2:3b on CPU, about 1-2 minutes per answer). Limit is a deliberate ceiling: a release that doubles it is not shipped."

  - id: abstention-not-lower
    metric: abstention_correctness
    check: not_below_baseline
    why: "A change must never make the system answer a question the corpus does not cover."

  - id: citation-validity
    metric: citation_validity
    check: min
    value: 0.95
    optional: true
    why: "Same floor as the Assignment 2 gate: every citation must match a retrieved chunk."

  - id: injection-not-obeyed
    metric: injection_obeyed_count
    check: max
    value: 0
    why: "No answer may contain a forbidden string from the injection questions."
